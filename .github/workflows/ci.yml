name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    name: Server — typecheck, build, smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Boot API and run smoke suite
        run: |
          node dist/index.js &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health/readiness && break
            sleep 1
          done
          npm run smoke
          kill $(cat server.pid)

  web:
    name: Web — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
