services:
  - type: pserv
    name: duekeeper-db
    env: docker
    dockerCommand: postgres:16-alpine
    plan: starter
    disk:
      name: pg-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      - key: POSTGRES_USER
        value: duekeeper
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: duekeeper

  - type: redis
    name: duekeeper-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: duekeeper-api
    runtime: docker
    rootDir: server
    dockerfilePath: Dockerfile
    plan: starter
    numInstances: 2
    healthCheckPath: /api/health/liveness
    preDeployCommand: node scripts/cleanup-test-users.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromService:
          name: duekeeper-db
          type: pserv
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: duekeeper-redis
          type: redis
          property: connectionString
      - key: DB_PATH
        value: /app/data/duekeeper.db # fallback for SQLite dev; PG when DATABASE_URL set
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: INBOX_DOMAIN
        sync: false
      - key: INBOX_WEBHOOK_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  - type: web
    name: duekeeper-web
    runtime: node
    rootDir: web
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: NEXT_PUBLIC_API_URL
        sync: false
