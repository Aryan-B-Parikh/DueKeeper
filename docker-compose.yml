services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duekeeper
      POSTGRES_PASSWORD: duekeeper
      POSTGRES_DB: duekeeper
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duekeeper"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./server
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://duekeeper:duekeeper@db:5432/duekeeper
      REDIS_URL: redis://redis:6379
      DB_PATH: /app/data/duekeeper.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env at repo root}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env at repo root}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMAIL_FROM: ${EMAIL_FROM:-DueKeeper <no-reply@duekeeper.local>}
      INBOX_DOMAIN: ${INBOX_DOMAIN:-inbox.duekeeper.local}
      INBOX_WEBHOOK_TOKEN: ${INBOX_WEBHOOK_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - duekeeper-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  duekeeper-data:
  pg-data:
  redis-data:
